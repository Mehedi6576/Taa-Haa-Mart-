
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taa-Haa Mart</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
    header { background: #4CAF50; color: white; padding: 1rem; text-align: center; }
    .container { padding: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .product { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product button { margin-top: 0.5rem; padding: 0.5rem 1rem; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .popup-content { background: white; padding: 2rem; border-radius: 10px; width: 300px; text-align: center; }
    .popup-content input { width: 80px; text-align: center; margin: 10px; }
    .close-btn { background: red; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; float: right; }
  </style>
</head>
<body>
  <header>
    <h1>Taa-Haa Mart</h1>
    <p>01322678467 | bKash, Nagad, Rocket</p>
  </header>
  <div class="container" id="productList"></div>

  <div class="popup" id="popup">
    <div class="popup-content">
      <button class="close-btn" onclick="closePopup()">X</button>
      <h2 id="popupTitle"></h2>
      <p id="popupDetail"></p>
      <p>প্রতি কেজি দাম: <strong id="unitPrice"></strong> টাকা</p>
      <label>কত কেজি নেবেন: <input type="number" id="quantity" value="1" min="1" onchange="calculateTotal()" /></label>
      <p>মোট দাম: <strong id="totalPrice"></strong> টাকা</p>
    </div>
  </div>

  <script>
    const products = [
      { name: "আম", detail: "রাজশাহীর মিষ্টি আম।", price: 120 },
      { name: "খেজুরের গুড়", detail: "খাঁটি খেজুরের গুড়।", price: 150 },
      { name: "খেজুর", detail: "উত্তম মানের খেজুর।", price: 200 },
      { name: "চাল", detail: "সুন্দরবনের আতপ চাল।", price: 70 },
      { name: "মুড়ি", detail: "খাঁটি মুড়ি।", price: 60 }
    ];

    const productList = document.getElementById("productList");
    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popupTitle");
    const popupDetail = document.getElementById("popupDetail");
    const unitPrice = document.getElementById("unitPrice");
    const totalPrice = document.getElementById("totalPrice");
    const quantityInput = document.getElementById("quantity");

    function openPopup(product) {
      popupTitle.textContent = product.name;
      popupDetail.textContent = product.detail;
      unitPrice.textContent = product.price;
      quantityInput.value = 1;
      totalPrice.textContent = product.price;
      popup.dataset.price = product.price;
      popup.style.display = "flex";
    }

    function closePopup() {
      popup.style.display = "none";
    }

    function calculateTotal() {
      const price = parseInt(popup.dataset.price);
      const qty = parseInt(quantityInput.value);
      totalPrice.textContent = price * qty;
    }

    products.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `<h3>${p.name}</h3><p>${p.detail}</p><p><strong>${p.price}</strong> টাকা/কেজি</p><button onclick='openPopup(${JSON.stringify(p)})'>অর্ডার করুন</button>`;
      productList.appendChild(div);
    });
  </script>
</body>
</html>
